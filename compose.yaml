services:
  applied-opt:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      APPLIED_OPT_TOKEN: "${APPLIED_OPT_TOKEN:?Set an API token of at least 16 characters}"
    volumes:
      - "./examples/demo-report.json:/data/report.json:ro"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
