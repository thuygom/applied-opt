name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test runtime, review, diagrams, protocol, and local HTTP
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: CLI smoke checks
        env:
          PYTHONPATH: src
        run: |
          python -m applied_opt --version
          python -m applied_opt review examples/review_target.py --format sarif --output /tmp/review.sarif --fail-on none
          python -m applied_opt plan examples/work.json --output /tmp/plan.json
      - name: Build installable wheel
        run: |
          python -m pip install build
          python -m build
      - name: Test installed production server through HTTP
        run: |
          python -m pip install '.[hosting]'
          python scripts/smoke_hosting.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the deployable webserver image
        run: docker build --tag applied-opt:ci .
      - name: Exercise the non-root read-only container through HTTP
        run: python scripts/smoke_hosting.py --docker-image applied-opt:ci
